<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .form-container {
            width: 500px;
            margin: 30px auto;
        }

        .form-group1 {
            display: grid;
            grid-template-columns: 130px 1fr;
            margin-bottom: 8px;
            align-items: start;
        }
        small {
            color: red;
            display: block;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form action="" id="form1">
            <div class="form-group1">
                <label>Địa chỉ email</label>
                <input type="text" id="email" value="">
                <small id="emailErorr"></small>
            </div>

            <div class="form-group1">
                <label>nhap password</label>
                <input type="text" id="pass" value="">
                <small id="passErorr"></small>
            </div>

            <button type="submit">Gui</button>
        </form>

        <form action="" id="form2">
            <button id="btn2">gui2</button>
        </form>
    </div>

    <script>
        const form1 = document.getElementById("form1");
        const form2 = document.getElementById("form2");
        const emailInput = document.getElementById("email");
        const emailErorr = document.getElementById("emailErorr");
        const passInput = document.getElementById("pass");
        const passErorr = document.getElementById("passErorr");

        let a = "";
        let b = "";

        form1.addEventListener("submit", function(e){
            e.preventDefault();

            email = emailInput.value;
            pass = passInput.value;
            let loi = 0;

            if(email === ""){
                emailErorr.textContent = "vui long nhap email";
                loi =1;
            }else{
                emailErorr.textContent = "";
                a = email;
            }


            if(pass === ""){
                passErorr.textContent = "vui long nhap pass";
                loi = 1;
            }else{
                passErorr.textContent="";
                b = pass;
            }

            if(loi == 0){
                alert("thanh cong");
            }
        })

        form2.addEventListener("submit",function(e){
            e.preventDefault();
            alert(a +"  "+ b);

        })

        
    </script>

    
</body>
</html>
