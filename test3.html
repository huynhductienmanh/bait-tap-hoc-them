<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style type="text/css">
    .hide {
      display: none;
    }
    .show {
      display: block;
    }
    
    ul li {
      display: inline-block;
      margin: 0 10px;
      background-color: red;
    }

   </style>
  <div class="demo">
    <ul>
      <li onclick="" id="tintuc">tin tuc</li>
      <li onclick="" id="bongda">bong da</li>
      <li onclick="" id="thoitrang">thoi trang</li>
    </ul>

    <div class="content">
      <div class="hide show" id="c-tintuc">
        <img src="https://picsum.photos/id/30/500/300" >
      </div>
      <div class="hide" id="c-bongda">
        <img src="https://picsum.photos/id/40/500/300" >
      </div>
      <div class="hide" id="c-thoitrang">
        <img src="https://picsum.photos/id/50/500/300" >
      </div>
    </div>
  </div>

  <script>
    const tintuc = document.getElementById("tintuc");
    const bongda = document.getElementById("bongda");
    const thoitrang = document.getElementById("thoitrang");

    const contentTintuc = document.getElementById("c-tintuc");
    const contentBongda = document.getElementById("c-bongda");
    const contentThoitrang = document.getElementById("c-thoitrang");
    

    function showContent(id) {

    if (id === "tintuc") {
      contentTintuc.classList.add("show");
      contentBongda.classList.remove("show");

    } else if (id === "bongda") {
      contentBongda.classList.add("show");

    } else if (id === "thoitrang") {
      contentThoitrang.classList.add("show");
    }
  }

  tintuc.onclick = function() {
    showContent("tintuc");
  };

  bongda.onclick = function() {
    showContent("bongda");
  };

  thoitrang.onclick = function() {
    showContent("thoitrang");
  };
    
  </script>
</body>
</html>
