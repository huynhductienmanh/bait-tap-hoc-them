<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      font-family: sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      width: 500px;
    }
    h1{
        text-align: center;
        color: red;
    }
    h2 {
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    small {
      color: red;
      display: block;
      margin-top: 3px;
    }
    #success-message {
      color: green;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Xử lý form trong javascript</h1>
        <form id="form" action="https://www.24h.com.vn/">

            <div class="form-group">
                <label>Email:</label>
                <input type="text" id="email" placeholder="Nhập email..." value="" />
                <small id="emailError"></small>
            </div> 

            <div class="form-group">
                <label>Pass:</label>
                <input type="text" id="pass" placeholder="Nhập pass..." value="" />
                <small id="passError"></small>
            </div>

            <!-- <textarea ></textarea> -->
            <button type="submit">Gửi</button>

        </form>
    </div>

    <script>
        const form = document.getElementById("form");
        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("emailError");
        const passInput = document.getElementById("pass");
        const passError = document.getElementById("passError");

        form.addEventListener("submit",function(e){
            e.preventDefault();

            email = emailInput.value;
            pass = passInput.value;

            if(email === ""){
                emailError.textContent = "vui long nhap email";
            }else{
                emailError.textContent = "";
            }


            if(pass === ""){
                passError.textContent = "vui long nhap passs";
            }else{
                passError.textContent = "";
            }

            if(email !== "" && pass !=""){
                alert("thanh cong")
                form.submit();
            }
        })

    </script>
    
</body>
</html>
