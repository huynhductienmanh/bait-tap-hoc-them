<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     
    <img id="bigImg"
         src="https://picsum.photos/id/10/500/300"
         width="500"
         height="300">

    <br><br>
    
    <img class="small"
         src="https://picsum.photos/id/10/500/300"
         width="100"
         height="70">

    <img class="small"
         src="https://picsum.photos/id/20/500/300"
         width="100"
         height="70">

    <img class="small"
         src="https://picsum.photos/id/30/500/300"
         width="100"
         height="70">

    <img class="small"
         src="https://picsum.photos/id/40/500/300"
         width="100"
         height="70">

    <script>
        const bigImg = document.getElementById("bigImg");
        const smallImgs = document.querySelectorAll(".small");

        smallImgs.forEach(function(img) {
            img.addEventListener("click", function() {
                const src = img.getAttribute("src");
                bigImg.setAttribute("src", src);
            });
        });

    </script>
</body>
</html>
