<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
      font-family: sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      width: 500px;
    }
    h1{
        text-align: center;
        color: red;
    }
    h2 {
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    small {
      color: red;
      display: block;
      margin-top: 3px;
    }
    #success-message {
      color: green;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    </style>
</head>
<body>
    <div class="form-container">
        <form action="https://www.24h.com.vn/" id="loginform">
            <div class="form-group">
                <label>checkbox:</label>
                <input type="checkbox" id="checkbox">
                <small id="checkboxError"></small>
            </div>

            <div class="form-group">
                <label>select:</label>
                <select name="" id="select">
                    <option value="">vui long chon</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>

                <small id="passError"></small>
            </div>

            <button type="submit">gui</button>
        </form>

    </div>

    <script>
        const form = document.getElementById("loginform");
        const checkbox = document.getElementById("checkbox");
        const select = document.getElementById("select");
        const checkboxError = document.getElementById("checkboxError");
        const passError = document.getElementById("passError");

        form.addEventListener("submit", function(e){
            e.preventDefault();

            let loi =0;
            kiemtra = checkbox.checked;
            if(kiemtra == false){
                checkboxError.textContent = "chua tich";
                loi = 1;
            }
            else{
                checkboxError.textContent = "";
            }

            getSelect = select.value;
            if(getSelect === ""){
                passError.textContent = "vui long chon";
                loi = 1;
            }
            else{
                passError.textContent="";
            }

            if(
                loi == 0
            ){
                alert("thanh cong");
                form.submit();
            }
        })

    </script>
    
</body>
</html>
